# One-off: generates an EF Core migration with the real tools and commits it back to this branch.
name: Generate migration
on:
  push:
    branches: [test/gen-migration]
    paths-ignore: ['src/Capitra.Infrastructure/Persistence/Migrations/**']
permissions:
  contents: write
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet tool install --global dotnet-ef --version 10.*
      - run: dotnet build src/Capitra.Api -c Debug -v q
      - run: dotnet ef migrations add SignInLog --project src/Capitra.Infrastructure --startup-project src/Capitra.Api --output-dir Persistence/Migrations --no-build
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Capitra.Infrastructure/Persistence/Migrations && git commit -m "SignInLog migration" && git push
