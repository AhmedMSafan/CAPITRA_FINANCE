# One-off: screenshots of the Screening pages with sample data, committed to this branch for review.
name: Screening screenshots
on:
  push:
    branches: [test/scr-screens]
    paths-ignore: ['screens/**']
permissions:
  contents: write
jobs:
  screens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: web
      - run: npm install --no-save playwright@1 && npx playwright install --with-deps chromium
        working-directory: web
      - run: (npx vite --port 5173 --strictPort > /tmp/vite.log 2>&1 &) && sleep 8
        working-directory: web
      - run: cp ../tools/screens/access-screens.mjs . && node access-screens.mjs ../screens
        working-directory: web
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screens && git commit -m "Screening screenshots" && git push
